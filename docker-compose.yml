services:
  cli-proxy-api:
    image: ${CPA_IMAGE:-p4-cpa/cpa:local}
    build:
      context: ./cpa
      dockerfile: Dockerfile
      args:
        VERSION: 1.0.0
        COMMIT: ${P4_CPA_SOURCE_COMMIT:-e2bff0107bb307337aaa19018ccddd55f64253d5}
        # Defaults to the imported source timestamp; override for a custom build.
        BUILD_DATE: ${CPA_BUILD_DATE:-2026-10-02T22:42:50+08:00}
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:${CPA_PORT:-8317}:8317"
      - "${OAUTH_BIND_IP:-127.0.0.1}:${OAUTH_GEMINI_PORT:-8085}:8085"
      - "${OAUTH_BIND_IP:-127.0.0.1}:${OAUTH_CODEX_PORT:-1455}:1455"
      - "${OAUTH_BIND_IP:-127.0.0.1}:${OAUTH_CLAUDE_PORT:-54545}:54545"
      - "${OAUTH_BIND_IP:-127.0.0.1}:${OAUTH_ANTIGRAVITY_PORT:-51121}:51121"
      - "${OAUTH_BIND_IP:-127.0.0.1}:${OAUTH_IFLOW_PORT:-11451}:11451"
    volumes:
      - ./config.yaml:/CLIProxyAPI/config.yaml
      - ./auths:/root/.cli-proxy-api
      - ./logs:/CLIProxyAPI/logs
      - ./plugins:/CLIProxyAPI/plugins
    healthcheck:
      # The upstream Debian image has bash, but no curl or wget.
      test:
        - CMD
        - bash
        - -ec
        - 'exec 3<>/dev/tcp/127.0.0.1/8317; printf "GET / HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; head -n 1 <&3 | grep -q " 200 "'
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    networks: [cpa]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  cpa-manager-plus:
    image: ${CPAMP_IMAGE:-p4-cpa/manager:local}
    build:
      context: ./manager
      dockerfile: Dockerfile.manager-server
      args:
        VERSION: 1.0.0
        SOURCE_COMMIT: ${P4_CPA_SOURCE_COMMIT:-05ebb7f275dbe575211cb886436d4b99936c1cd9}
    restart: unless-stopped
    depends_on:
      cli-proxy-api:
        condition: service_healthy
    ports:
      - "${BIND_IP:-127.0.0.1}:${CPAMP_PORT:-18317}:18317"
    environment:
      HTTP_ADDR: "0.0.0.0:18317"
      USAGE_DATA_DIR: /data
      USAGE_DB_PATH: /data/usage.sqlite
      CPAMP_UPDATE_CHECK_ENABLED: "false"
      CPA_MANAGER_DATA_KEY_PATH: /data/data.key
      CPA_UPSTREAM_URL: http://cli-proxy-api:8317
      CPA_MANAGEMENT_KEY: ${CPA_MANAGEMENT_KEY:?Run scripts/init.sh first}
      CPA_MANAGER_ADMIN_KEY: ${CPAMP_ADMIN_KEY:?Run scripts/init.sh first}
      # CPA v8 disables the legacy RESP output; use its HTTP usage queue.
      USAGE_COLLECTOR_MODE: http
    volumes:
      - ./data:/data
    healthcheck:
      test: [CMD, wget, -qO-, "http://127.0.0.1:18317/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    networks: [cpa]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  https:
    profiles: [https]
    image: p4-cpa/https:local
    build: ./https
    restart: unless-stopped
    depends_on:
      cpa-manager-plus:
        condition: service_healthy
    ports:
      - "${HTTPS_BIND_IP:-127.0.0.1}:${HTTPS_PORT:-19443}:443"
    environment:
      HTTPS_HOST: ${HTTPS_HOST:-cpa.home.ccly.dev}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      # Any other hostname arriving on this port is passed through, still encrypted, to here.
      HTTPS_PASSTHROUGH_UPSTREAM: ${HTTPS_PASSTHROUGH_UPSTREAM:-host.docker.internal:443}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./https/Caddyfile:/etc/caddy/Caddyfile:ro
      # Included in the existing cold backup alongside the manager data.
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    healthcheck:
      test: [CMD, wget, -qO, /dev/null, "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    networks: [cpa]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  cpa:
    driver: bridge
